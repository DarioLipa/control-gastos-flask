<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="daliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base de la letra D estilizada -->
  <path d="M 24 16 L 62 16 C 88 16 106 34 106 60 C 106 86 88 104 62 104 L 24 104 Z" fill="url(#daliGrad)" filter="url(#glow)"/>
  <!-- Espacio interior de la D -->
  <path d="M 42 34 L 60 34 C 76 34 88 46 88 60 C 88 74 76 86 60 86 L 42 86 Z" fill="#FFFFFF"/>
  <!-- Barras financieras y moneda de crecimiento dentro de la D -->
  <rect x="48" y="62" width="6" height="16" rx="3" fill="#0284C7"/>
  <rect x="58" y="52" width="6" height="26" rx="3" fill="#0EA5E9"/>
  <rect x="68" y="42" width="6" height="36" rx="3" fill="url(#barGrad)"/>
  <!-- Moneda decorativa superior -->
  <circle cx="71" cy="34" r="5" fill="#F59E0B"/>
</svg>

