<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Dali_Gastos</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/panda.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <!-- ENCABEZADO CON LOGO DE MARCA -->
    <div class="login-header">
      <div style="display: flex; justify-content: center; margin-bottom: 0.5rem;">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo Dali_Gastos" width="56" height="56">
      </div>
      <h1 class="login-title">Dali<span style="color: var(--accent-emerald);">_Gastos</span></h1>
      <p class="login-desc">Control y Gestión Financiera Inteligente</p>
    </div>

    <!-- MASCOTA PANDA INTERACTIVA -->
    <div id="pandaWrapper" class="panda-wrapper">
      <svg class="panda-svg" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="pawShade" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0F172A"/>
          </radialGradient>
        </defs>

        <!-- OREJAS -->
        <circle cx="52" cy="56" r="22" fill="#0F172A"/>
        <circle cx="52" cy="56" r="14" fill="#334155"/>
        <circle cx="148" cy="56" r="22" fill="#0F172A"/>
        <circle cx="148" cy="56" r="14" fill="#334155"/>

        <!-- CABEZA -->
        <g class="panda-head">
          <!-- Cara blanca -->
          <ellipse cx="100" cy="94" rx="64" ry="54" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

          <!-- Mancha ocular izquierda -->
          <ellipse cx="76" cy="90" rx="17" ry="21" fill="#0F172A" transform="rotate(-15 76 90)"/>
          <!-- Mancha ocular derecha -->
          <ellipse cx="124" cy="90" rx="17" ry="21" fill="#0F172A" transform="rotate(15 124 90)"/>

          <!-- Ojo izquierdo -->
          <circle class="panda-eye-white eye-left" cx="77" cy="89" r="8" fill="#FFFFFF"/>
          <g class="panda-pupil pupil-left">
            <circle cx="77" cy="89" r="4.5" fill="#0F172A"/>
            <circle cx="78.5" cy="87.5" r="1.5" fill="#FFFFFF"/>
          </g>

          <!-- Ojo derecho -->
          <circle class="panda-eye-white eye-right" cx="123" cy="89" r="8" fill="#FFFFFF"/>
          <g class="panda-pupil pupil-right">
            <circle cx="123" cy="89" r="4.5" fill="#0F172A"/>
            <circle cx="124.5" cy="87.5" r="1.5" fill="#FFFFFF"/>
          </g>

          <!-- Hocico y Nariz -->
          <ellipse cx="100" cy="112" rx="18" ry="12" fill="#F8FAFC"/>
          <path d="M 94 107 C 97 104 103 104 106 107 C 108 110 102 114 100 115 C 98 114 92 110 94 107 Z" fill="#0F172A"/>
          <!-- Sonrisa -->
          <path d="M 96 117 Q 100 120 104 117" stroke="#0F172A" stroke-width="1.8" fill="none" stroke-linecap="round"/>

          <!-- Mejillas sonrosadas suaves -->
          <circle cx="58" cy="106" r="6" fill="#F43F5E" opacity="0.3"/>
          <circle cx="142" cy="106" r="6" fill="#F43F5E" opacity="0.3"/>
        </g>

        <!-- PATAS DELANTERAS (SE MUEVEN PARA TAPAR LOS OJOS) -->
        <!-- Pata Izquierda -->
        <g class="panda-paw-left" id="pawLeft">
          <ellipse cx="58" cy="158" rx="20" ry="17" fill="url(#pawShade)"/>
          <circle cx="58" cy="158" r="9" fill="#475569"/>
          <!-- Almohadillas de dedos -->
          <circle cx="48" cy="148" r="4" fill="#64748B"/>
          <circle cx="58" cy="144" r="4" fill="#64748B"/>
          <circle cx="68" cy="148" r="4" fill="#64748B"/>
        </g>

        <!-- Pata Derecha -->
        <g class="panda-paw-right" id="pawRight">
          <ellipse cx="142" cy="158" rx="20" ry="17" fill="url(#pawShade)"/>
          <circle cx="142" cy="158" r="9" fill="#475569"/>
          <!-- Almohadillas de dedos -->
          <circle cx="132" cy="148" r="4" fill="#64748B"/>
          <circle cx="142" cy="144" r="4" fill="#64748B"/>
          <circle cx="152" cy="148" r="4" fill="#64748B"/>
        </g>
      </svg>
    </div>

    <!-- ALERTAS Y MENSAJES -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alert-container" style="margin-bottom: 1.25rem;">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- FORMULARIO DE ACCESO -->
    <form action="{{ url_for('login') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 1.1rem;">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" required autocomplete="username" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password">Contraseña</label>
        <div class="password-input-group">
          <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña de acceso" required autocomplete="current-password">
          <button type="button" id="togglePassword" class="btn-toggle-password" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Ingresar al Sistema
      </button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/panda.js') }}"></script>
</body>
</html>
